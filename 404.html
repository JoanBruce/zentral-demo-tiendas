    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser translation is opted out on purpose. Chrome Translate swaps text
         nodes underneath React, which then fails to reconcile against DOM it no
         longer owns: the whole app died with NotFoundError 'insertBefore' (seen
         in production on /mi-fichaje, and the React error itself came through
         translated, which is the tell). The UI already ships ES and EN through
         i18next, so machine translation adds nothing and only breaks rendering. -->
    <meta name="google" content="notranslate" />
    <title>Zentral</title>
    <!-- Runtime config: the container generates /config.js (window.__RUNTIME_CONFIG__)
         at startup. Blocking and before the bundle so env.constants sees it.

        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg, #0a0a0a);
        transition: opacity 180ms ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash.is-gone {
        display: none !important;
      }
      #app-splash-logo {
        width: 96px;
        height: 96px;
        -o-object-fit: contain;
           object-fit: contain;
        animation: splash-spin 1.6s linear infinite;
      }
      @keyframes splash-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash-logo { animation-duration: 3s; }
      }
    </style>
